<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Продвинутый научный калькулятор</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', 'Consolas', monospace;
            padding: 20px;
            margin: 0;
        }

        /* Главный контейнер */
        .calculator {
            max-width: 600px;
            width: 100%;
            background: rgba(22, 34, 48, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        /* Дисплей и история */
        .display-section {
            background: #0b1219;
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .history {
            min-height: 48px;
            font-size: 1rem;
            color: #8aaec0;
            text-align: right;
            font-family: 'Consolas', monospace;
            word-break: break-word;
            overflow-y: auto;
            max-height: 70px;
            padding: 5px 10px;
            border-bottom: 1px dashed #2a3e4e;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .expression-input {
            text-align: right;
            margin-bottom: 12px;
        }

        #expression {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 2rem;
            font-weight: 600;
            color: #eef4ff;
            font-family: 'Consolas', monospace;
            text-align: right;
            outline: none;
            padding: 8px 0;
            letter-spacing: 1px;
        }

        .result-area {
            text-align: right;
            font-size: 2.3rem;
            font-weight: bold;
            color: #f0c674;
            font-family: 'Consolas', monospace;
            padding: 8px 0px;
            border-top: 1px solid #1e2f3a;
            margin-top: 6px;
            word-break: break-word;
        }

        #resultDisplay {
            font-size: 2rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* Сетка кнопок */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        button {
            background: #1e2f3c;
            border: none;
            padding: 16px 0;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 32px;
            color: #dfeef5;
            font-family: 'Segoe UI', monospace;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 1px 2px black;
        }

        .btn-function {
            background: #2c4c6c;
            color: #ffecb3;
            font-size: 1rem;
        }

        .btn-number {
            background: #1f3a48;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .btn-operator {
            background: #2b5e7a;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffe0a3;
        }

        .btn-equal {
            background: #e68a2e;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 0 8px rgba(230, 138, 46, 0.6);
        }

        .btn-clear {
            background: #882c2c;
            color: #ffc9c9;
        }

        .btn-history {
            background: #2c4f5c;
        }

        /* адаптация */
        @media (max-width: 480px) {
            .calculator {
                padding: 15px;
            }
            .buttons-grid {
                gap: 8px;
            }
            button {
                padding: 12px 0;
                font-size: 1rem;
            }
            .btn-number {
                font-size: 1.2rem;
            }
            #expression {
                font-size: 1.4rem;
            }
            #resultDisplay {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<div class="calculator">
    <div class="display-section">
        <div class="history" id="historyLog">📜 История пуста</div>
        <div class="expression-input">
            <input type="text" id="expression" placeholder="0" value="0" inputmode="text">
        </div>
        <div class="result-area">
            <span id="resultDisplay">0</span>
        </div>
    </div>
    <div class="buttons-grid" id="buttonsContainer">
        <!-- Кнопки будут динамически сгенерированы, но для наглядности сделаем через JS -->
    </div>
</div>

<script>
    // ---------- ПРОДВИНУТЫЙ КАЛЬКУЛЯТОР с научными функциями ----------
    // Поддерживает: + - * / % ^ (степень), sqrt, sin, cos, tan, ln, log10, факториал, PI, e, скобки
    // Обработка ошибок, история вычислений (макс 12 записей)

    // DOM элементы
    const expressionInput = document.getElementById('expression');
    const resultSpan = document.getElementById('resultDisplay');
    const historyDiv = document.getElementById('historyLog');

    // Состояние
    let currentExpression = "0";     // отображаемое выражение
    let lastResult = null;            // последний вычисленный результат (число)
    let historyEntries = [];           // массив строк истории

    // Обновить дисплей выражения
    function updateDisplay() {
        expressionInput.value = currentExpression;
    }

    // Обновить результат на дисплее
    function updateResult(value) {
        if (value === undefined || value === null) {
            resultSpan.innerText = "0";
        } else {
            // Красивое форматирование чисел: убираем излишнюю длинную плавающую часть
            let strValue = String(value);
            if (typeof value === 'number') {
                if (isNaN(value)) strValue = "Ошибка (NaN)";
                else if (!isFinite(value)) strValue = "∞ / Ошибка";
                else {
                    // если число слишком длинное, округлить до 8 знаков
                    if (Math.abs(value) > 1e12 || (Math.abs(value) < 1e-6 && value !== 0)) {
                        strValue = value.toExponential(8);
                    } else {
                        strValue = parseFloat(value.toFixed(10)).toString();
                    }
                }
            }
            resultSpan.innerText = strValue;
        }
    }

    // Добавить запись в историю (текст + результат)
    function addHistory(expr, res) {
        let formattedRes = (typeof res === 'number' && !isNaN(res) && isFinite(res)) ? 
                            (Math.abs(res) > 1e10 ? res.toExponential(6) : parseFloat(res.toFixed(8)).toString()) : 
                            (res?.toString() || "Ошибка");
        let historyStr = `${expr} = ${formattedRes}`;
        historyEntries.unshift(historyStr);
        if (historyEntries.length > 12) historyEntries.pop();
        renderHistory();
    }

    function renderHistory() {
        if (historyEntries.length === 0) {
            historyDiv.innerHTML = "📜 История пуста";
        } else {
            historyDiv.innerHTML = historyEntries.map(entry => `<div style="font-size:0.85rem; padding:2px 0; border-bottom:1px dotted #2a4a5a;">📌 ${escapeHtml(entry)}</div>`).join('');
            historyDiv.scrollTop = 0;
        }
    }

    // простой esc для защиты от xss
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // безопасная замена математических выражений с поддержкой научных функций
    // Основной движок: функция eval, но предварительно обрабатываем токены, чтобы обезопасить
    // используем только стандартные математические объекты + дополнительные (factorial, ^)
    function evaluateExpression(expr) {
        // Убираем лишние пробелы и заменяем ^ на **
        let processed = expr.replace(/\s+/g, '');
        if (processed === "") return 0;
        
        // Замена значков:  ^ -> **
        processed = processed.replace(/\^/g, '**');
        
        // Обработка факториала ! (например 5! , (5+2)! )
        // Сложный парсинг: найдем все вхождения '!' перед которым число или выражение в скобках
        // Делаем пошагово: разбиваем на токены, но проще заменить через регулярку с рекурсивным вычислением
        // Реализуем функцию замены факториала: факториал применяется к ближайшему числу/скобке
        // Шаблон: (\d+(?:\.\d+)?|\([^()]*\)|(?:[a-z]+\([^)]*\)))!
        // Будем последовательно заменять в цикле пока есть !
        let factProcessed = processed;
        let factorialRegex = /(\d+(?:\.\d+)?|\([^()]+\)|(?:[a-z]+\([^)]+\)))!/gi;
        let maxLoops = 50;
        while (factorialRegex.test(factProcessed) && maxLoops-- > 0) {
            factProcessed = factProcessed.replace(factorialRegex, (match, group) => {
                let innerValue;
                try {
                    // рекурсивно вычислим внутреннее выражение без факториала
                    innerValue = evaluatePureExpression(group);
                    if (isNaN(innerValue) || !isFinite(innerValue)) throw new Error("Invalid factorial");
                    let num = Number(innerValue);
                    if (num < 0 || !Number.isInteger(num)) throw new Error("Факториал только для неотрицательных целых");
                    let fact = 1;
                    for (let i = 2; i <= num; i++) fact *= i;
                    return fact.toString();
                } catch(e) {
                    return "NaN";
                }
            });
            factorialRegex.lastIndex = 0;
        }
        
        // дополнительно: поддержка констант PI, E
        let withConst = factProcessed.replace(/π/gi, 'Math.PI').replace(/pi\b/gi, 'Math.PI')
                                     .replace(/\be\b(?![\w])/gi, 'Math.E');
        // функции: sin, cos, tan, asin, acos, atan, ln, log, sqrt, abs
        // преобразуем в вызовы Math.xxx
        withConst = withConst.replace(/sin\(/gi, 'Math.sin(')
                             .replace(/cos\(/gi, 'Math.cos(')
                             .replace(/tan\(/gi, 'Math.tan(')
                             .replace(/asin\(/gi, 'Math.asin(')
                             .replace(/acos\(/gi, 'Math.acos(')
                             .replace(/atan\(/gi, 'Math.atan(')
                             .replace(/ln\(/gi, 'Math.log(')
                             .replace(/log10\(/gi, 'Math.log10(')
                             .replace(/log\(/gi, 'Math.log10(')
                             .replace(/sqrt\(/gi, 'Math.sqrt(')
                             .replace(/abs\(/gi, 'Math.abs(');
        // дополнительная степень exp
        withConst = withConst.replace(/exp\(/gi, 'Math.exp(');
        
        // также обработаем процент: выражение% -> но просто как процент от предыдущего ? сделаем базово: число% = число/100
        let percentProcessed = withConst.replace(/(\d+(?:\.\d+)?)\%/g, (_, num) => `(${num}/100)`);
        
        // наконец, безопасное вычисление через Function constructor (более безопасно чем eval)
        // но всё равно блокируем доступ к глобальным объектам
        let finalExpression = percentProcessed;
        try {
            // дополнительно проверка на разрешенные символы (буквы мат функций уже есть)
            // позволим цифры, операции, скобки, точки, Math, константы
            const risky = /[a-zA-Z]/g;
            let allowedWords = ['Math', 'PI', 'E', 'sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'log', 'log10', 'sqrt', 'abs', 'exp'];
            let allMatches = finalExpression.match(/[a-zA-Z]+/g) || [];
            for (let match of allMatches) {
                if (!allowedWords.includes(match) && match !== 'Math' && match !== 'PI' && match !== 'E') {
                    throw new Error("Недопустимая функция или символ: " + match);
                }
            }
            // создаем функцию возвращающую результат
            const compute = new Function('return (' + finalExpression + ')');
            let result = compute();
            if (isNaN(result)) throw new Error("Неопределенный результат");
            return result;
        } catch (err) {
            console.warn(err);
            throw new Error("Ошибка вычисления: " + err.message);
        }
    }
    
    // вспомогательная: чистое вычисление без факториалов (для рекурсивной замены)
    function evaluatePureExpression(expr) {
        let exprStr = expr;
        exprStr = exprStr.replace(/\^/g, '**');
        exprStr = exprStr.replace(/π/gi, 'Math.PI').replace(/pi\b/gi, 'Math.PI').replace(/\be\b/gi, 'Math.E');
        exprStr = exprStr.replace(/sin\(/gi, 'Math.sin(').replace(/cos\(/gi, 'Math.cos(').replace(/tan\(/gi, 'Math.tan(');
        exprStr = exprStr.replace(/asin\(/gi, 'Math.asin(').replace(/acos\(/gi, 'Math.acos(').replace(/atan\(/gi, 'Math.atan(');
        exprStr = exprStr.replace(/ln\(/gi, 'Math.log(').replace(/log10\(/gi, 'Math.log10(').replace(/log\(/gi, 'Math.log10(');
        exprStr = exprStr.replace(/sqrt\(/gi, 'Math.sqrt(').replace(/abs\(/gi, 'Math.abs(').replace(/exp\(/gi, 'Math.exp(');
        exprStr = exprStr.replace(/(\d+(?:\.\d+)?)\%/g, (_, num) => `(${num}/100)`);
        const compute = new Function('return (' + exprStr + ')');
        let res = compute();
        if (isNaN(res)) throw new Error("Ошибка");
        return res;
    }
    
    // Основное вычисление с обработкой ошибок и обновлением состояния
    function computeAndShow(expressStr, saveToHistory = true) {
        if (!expressStr || expressStr.trim() === "") {
            updateResult("0");
            return 0;
        }
        try {
            let res = evaluateExpression(expressStr);
            if (isNaN(res) || !isFinite(res)) {
                updateResult("Ошибка");
                if(saveToHistory) addHistory(expressStr, "Ошибка (некорректно)");
                return NaN;
            }
            // округление для красоты
            updateResult(res);
            lastResult = res;
            if (saveToHistory) {
                addHistory(expressStr, res);
            }
            return res;
        } catch (err) {
            updateResult("⚠️ Ошибка");
            if(saveToHistory) addHistory(expressStr, err.message);
            return NaN;
        }
    }
    
    // Добавление символа / цифры в выражение
    function appendToExpression(value) {
        if (currentExpression === "0" && !isNaN(value) && value !== '.') {
            currentExpression = value;
        } else if (currentExpression === "0" && value === '.') {
            currentExpression = "0.";
        } else {
            currentExpression += value;
        }
        updateDisplay();
        // Автоматически обновлять результат по мере ввода? сделаем ленивый показ, только по "=" и функциям.
        // но для удобства можно вычислять сразу? лучше по запросу, однако динамический превью:
        try {
            let preview = evaluateExpression(currentExpression);
            if (!isNaN(preview) && isFinite(preview)) {
                let previewVal = (Math.abs(preview) > 1e12) ? preview.toExponential(8) : parseFloat(preview.toFixed(8)).toString();
                resultSpan.innerText = previewVal;
            } else {
                // не обновляем ошибочно
                if(currentExpression !== "") resultSpan.innerText = "...";
            }
        } catch(e) {
            // ничего, просто игнорим
        }
    }
    
    function clearAll() {
        currentExpression = "0";
        updateDisplay();
        updateResult("0");
    }
    
    function clearEntry() {
        currentExpression = "0";
        updateDisplay();
        // но результат оставляем прежним
    }
    
    function backspace() {
        if (currentExpression.length === 1 || (currentExpression === "0")) {
            currentExpression = "0";
        } else {
            currentExpression = currentExpression.slice(0, -1);
            if (currentExpression === "") currentExpression = "0";
        }
        updateDisplay();
        try {
            let preview = evaluateExpression(currentExpression);
            if (!isNaN(preview) && isFinite(preview)) resultSpan.innerText = parseFloat(preview.toFixed(8)).toString();
            else resultSpan.innerText = "?";
        } catch(e) { resultSpan.innerText = "?"; }
    }
    
    function setExpressionFromHistory(index) {
        // получаем строку из истории, обрезаем часть " = результат"
        if (index >= 0 && index < historyEntries.length) {
            let entry = historyEntries[index];
            let exprPart = entry.split(' = ')[0];
            if (exprPart) {
                currentExpression = exprPart;
                updateDisplay();
                computeAndShow(currentExpression, false);
            }
        }
    }
    
    // функция для вставки функций / констант
    function insertFunction(func) {
        if (currentExpression === "0") {
            currentExpression = func + "(";
        } else {
            currentExpression += func + "(";
        }
        updateDisplay();
    }
    
    function insertConstant(constant) {
        if (currentExpression === "0") {
            currentExpression = constant;
        } else {
            currentExpression += constant;
        }
        updateDisplay();
    }
    
    function addOperator(op) {
        const lastChar = currentExpression.slice(-1);
        if (['+','-','*','/','^','%'].includes(lastChar) && !(op === '-')) {
            currentExpression = currentExpression.slice(0, -1) + op;
        } else {
            if (currentExpression === "0" && op !== '-') {
                currentExpression = op;
            } else {
                currentExpression += op;
            }
        }
        updateDisplay();
    }
    
    // вычисление итога
    function evaluateFinal() {
        let expr = currentExpression;
        let res = computeAndShow(expr, true);
        if (!isNaN(res) && isFinite(res)) {
            currentExpression = res.toString();
            updateDisplay();
        }
    }
    
    // генерация кнопок (UI)
    function buildButtons() {
        const container = document.getElementById('buttonsContainer');
        const buttonsDef = [
            // ряд 1
            {text:"C", action:()=>clearAll(), class:"btn-clear"},
            {text:"⌫", action:()=>backspace(), class:"btn-clear"},
            {text:"( )", action:()=>{appendToExpression('()');}, class:"btn-function"},
            {text:"%", action:()=>appendToExpression('%'), class:"btn-operator"},
            {text:"/", action:()=>addOperator('/'), class:"btn-operator"},
            // ряд 2
            {text:"7", action:()=>appendToExpression('7'), class:"btn-number"},
            {text:"8", action:()=>appendToExpression('8'), class:"btn-number"},
            {text:"9", action:()=>appendToExpression('9'), class:"btn-number"},
            {text:"*", action:()=>addOperator('*'), class:"btn-operator"},
            {text:"^", action:()=>addOperator('^'), class:"btn-operator"},
            // ряд 3
            {text:"4", action:()=>appendToExpression('4'), class:"btn-number"},
            {text:"5", action:()=>appendToExpression('5'), class:"btn-number"},
            {text:"6", action:()=>appendToExpression('6'), class:"btn-number"},
            {text:"-", action:()=>addOperator('-'), class:"btn-operator"},
            {text:"+", action:()=>addOperator('+'), class:"btn-operator"},
            // ряд 4
            {text:"1", action:()=>appendToExpression('1'), class:"btn-number"},
            {text:"2", action:()=>appendToExpression('2'), class:"btn-number"},
            {text:"3", action:()=>appendToExpression('3'), class:"btn-number"},
            {text:"sin", action:()=>insertFunction('sin'), class:"btn-function"},
            {text:"cos", action:()=>insertFunction('cos'), class:"btn-function"},
            // ряд 5
            {text:"0", action:()=>appendToExpression('0'), class:"btn-number"},
            {text:".", action:()=>appendToExpression('.'), class:"btn-number"},
            {text:"√", action:()=>insertFunction('sqrt'), class:"btn-function"},
            {text:"ln", action:()=>insertFunction('ln'), class:"btn-function"},
            {text:"log", action:()=>insertFunction('log10'), class:"btn-function"},
            // ряд 6 дополнительные
            {text:"π", action:()=>insertConstant('π'), class:"btn-function"},
            {text:"e", action:()=>insertConstant('e'), class:"btn-function"},
            {text:"tan", action:()=>insertFunction('tan'), class:"btn-function"},
            {text:"!", action:()=>appendToExpression('!'), class:"btn-function"},
            {text:"=", action:()=>evaluateFinal(), class:"btn-equal"}
        ];
        container.innerHTML = "";
        buttonsDef.forEach(btn => {
            const button = document.createElement('button');
            button.innerText = btn.text;
            button.className = btn.class;
            button.onclick = (e) => {
                e.preventDefault();
                btn.action();
            };
            container.appendChild(button);
        });
        // дополнительно история кликабельная (доп. функционал - возможность вставить выражение из истории)
        historyDiv.style.cursor = "pointer";
        historyDiv.addEventListener('click', (e) => {
            let target = e.target;
            if (target.tagName === 'DIV' && historyDiv.contains(target)) {
                let innerHtml = target.innerText;
                let exprClean = innerHtml.split(' = ')[0]?.replace(/^📌 /, '');
                if(exprClean && exprClean.length) {
                    currentExpression = exprClean;
                    updateDisplay();
                    computeAndShow(currentExpression, false);
                }
            }
        });
    }
    
    // инициализация
    function init() {
        buildButtons();
        clearAll();
        updateResult(0);
        renderHistory();
        // Поддержка ввода с клавиатуры
        expressionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                evaluateFinal();
            }
        });
        expressionInput.addEventListener('input', (e) => {
            currentExpression = e.target.value;
            if (currentExpression === "") currentExpression = "0";
            updateDisplay();
            try {
                let preview = evaluateExpression(currentExpression);
                if (!isNaN(preview) && isFinite(preview)) resultSpan.innerText = preview.toFixed(8);
                else resultSpan.innerText = "?";
            } catch(e) { resultSpan.innerText = "?"; }
        });
    }
    
    init();
</script>
</body>
</html>
